<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Calculator 3D application icon.jpg">
    <title>My-Calculator</title>
    <link rel="stylesheet" href="calculator.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Modak&family=Spicy+Rice&display=swap" rel="stylesheet">

    <!-- bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"> 

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <main>
        <section class="container-fluid calculator">
           <div class="top-box">
                <div>
                    <input class="w-100 display" type="text" id="inputBox" readonly  onclick="updateVal()">
                </div>
               
           </div>
           <div class="top-box-2">
                 <div class="icons">
                        <button class=" btn-history" onclick="historyShow()"><i class=" bi bi-clock"></i></button>
                        <button class="x-btn" data-key="Backspace" onclick="delateNum()"><i class="bi bi-backspace"></i></button>
                 </div>

                <div class="number-pad">
                    <div class="numbers">

                            <button class="btn c-btn btn-ac" data-key="Delete" onclick="clearAllNum()"><i class="fa-solid fa-c"></i></button>
                            <button class="btn o-btn btn-p" data-key="%" onclick="setNum('%')"><i class="fa-solid fa-percent"></i></button>
                            <button class="btn o-btn btn-d" data-key="/" onclick="setNum('/')"><i class="fa-solid fa-divide"></i></button>
                    
                            <button class="btn n-btn btn-7" data-key="7" onclick="setNum('7')"><i class="fa-solid fa-7"></i></button>
                            <button class="btn n-btn btn-8" data-key="8" onclick="setNum('8')"><i class="fa-solid fa-8"></i></button>
                            <button class="btn n-btn btn-9" data-key="9" onclick="setNum('9')"><i class="fa-solid fa-9"></i></button>
                            <button class="btn o-btn btn-m" data-key="*" onclick="setNum('*')"><i class="fa-solid fa-xmark"></i></button>
                    
                            <button class="btn n-btn btn-4" data-key="4" onclick="setNum('4')"><i class="fa-solid fa-4"></i></button>
                            <button class="btn n-btn btn-5" data-key="5" onclick="setNum('5')"><i class="fa-solid fa-5"></i></button>
                            <button class="btn n-btn btn-6" data-key="6" onclick="setNum('6')"><i class="fa-solid fa-6"></i></button>
                            <button class="btn o-btn btn-minus" data-key="-" onclick="setNum('-')"><i class="fa-solid fa-minus"></i></button>    
                    
                            <button class="btn n-btn btn-3" data-key="3" onclick="setNum('3')"><i class="fa-solid fa-3"></i></button>
                            <button class="btn n-btn btn-2" data-key="2" onclick="setNum('2')"><i class="fa-solid fa-2"></i></button>
                            <button class="btn n-btn btn-1" data-key="1" onclick="setNum('1')"><i class="fa-solid fa-1"></i></button>
                            <button class="btn o-btn btn-plus" data-key="+" onclick="setNum('+')"><i class="fa-solid fa-plus"></i></button>
                    
                            <button class="btn n-btn btn-dot" data-key="." onclick="setNum('.')">.</button>
                            <button class="btn n-btn btn-0" data-key="0" onclick="setNum('0')"><i class="fa-solid fa-0"></i></button>
                            <button class="btn e-btn " data-key="Enter" onclick="equalNums()"><i class="fa-solid fa-equals"></i></button>
                
                    </div>
                    <div class="history">
                        <h6>History...</h6>
                        <div class="history-body"></div>
                        <div class="trash" onclick="historyDelate()">
                            <i class="bi bi-trash"></i>            
                        </div>
                    </div>
                </div>
           </div>
            

        </section>
    </main>
    <div>
        
    </div>
</body>
<script src="calculator.js"></script>
</html>
